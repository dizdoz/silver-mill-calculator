name: Update silver market price

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: write

jobs:
  update-price:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repository
        uses: actions/checkout@v4

      - name: Fetch silver market price
        env:
          METALS_API_KEY: ${{ secrets.METALS_DEV_API_KEY }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone

          key = os.environ["METALS_API_KEY"]
          if not key:
              raise SystemExit("METALS_DEV_API_KEY secret is not configured")

          params = urllib.parse.urlencode({
              "api_key": key,
              "currency": "GBP",
              "unit": "g"
          })
          url = "https://api.metals.dev/v1/latest?" + params

          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)

          if data.get("status") != "success":
              raise SystemExit(f"Metals.Dev returned: {data}")

          silver = data.get("metals", {}).get("silver")
          if not isinstance(silver, (int, float)):
              raise SystemExit("Silver price missing from response")

          now = datetime.now(timezone.utc).isoformat()
          timestamp = data.get("timestamp") or now
          pulled_at = now
          sterling = round(float(silver) * 0.925, 6)

          history = []
          try:
              with open("silver-price.json", encoding="utf-8") as f:
                  old = json.load(f)
                  history = old.get("history", [])
          except (FileNotFoundError, json.JSONDecodeError):
              pass

          history.append({
              "timestamp": timestamp,
              "price_gbp_per_gram": sterling
          })
          history = history[-180:]

          payload = {
              "metal": "sterling_silver_925",
              "market_price_gbp_per_gram": sterling,
              "source": "Metals.Dev",
              "source_timestamp": timestamp,
              "published_at": now,
              "pulled_at": pulled_at,
              "history": history
          }

          with open("silver-price.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY

      - name: Commit updated market price
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silver-price.json
          git diff --cached --quiet || git commit -m "Update sterling silver market price"
          git push
